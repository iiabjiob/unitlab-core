services:
  mosquitto:
    volumes:
      - ./config/mosquitto.secure.conf:/mosquitto/config/mosquitto.conf:ro
      - /opt/unitlab/shared/mosquitto.password:/mosquitto/config/passwordfile:ro
      - ./config/mosquitto.secure.acl:/mosquitto/config/aclfile:ro
      - mosquitto_data:/mosquitto/data

volumes:
  mosquitto_data:
