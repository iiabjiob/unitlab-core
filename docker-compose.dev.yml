services:

  adminer:
    image: adminer
    container_name: fat-simulator-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  # (Опционально) Поменять настройку nginx:
  # может захотим другой порт для dev, чтоб не конфликтовать с системой.
  nginx:
    ports:
      - "8080:80"