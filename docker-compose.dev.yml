services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - unitlab-dev:latest
    container_name: unitlab-dev-container
    volumes:
      - .:/workspace
    command: sleep infinity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - net

  iec61850-ied:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - unitlab-dev:latest
    container_name: unitlab-iec61850-ied-dev
    working_dir: /workspace
    ports:
      - "12347:12347"
      - "12348:12348"
    command: >
      bash -lc "cmake -S /workspace/simulator/iec61850_ied -B /tmp/unitlab-iec61850-ied-build &&
      cmake --build /tmp/unitlab-iec61850-ied-build --target unitlab-iec61850-ied-sim &&
      exec /tmp/unitlab-iec61850-ied-build/unitlab-iec61850-ied-sim --fixture /workspace/simulator/iec61850_ied/examples/single-report.fixture.json --ied IED1 --bind 0.0.0.0 --port 12347 --native-wire-start"
    networks:
      - net
  db:
    image: postgres:16
    container_name: unitlab-db-dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.db.dev
    ports:
      - "5433:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    networks:
      - net

  redis:
    image: redis:7
    container_name: unitlab-redis-dev
    tmpfs:
      - /data
    ports:
      - "6379:6379"
    networks:
      - net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: unitlab-mosquitto-dev
    ports:
      - "1883:1883"
    tmpfs:
      - /mosquitto/data
      - /mosquitto/log
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - net

volumes:
  db_data_dev:

networks:
  net:
