services:
  db:
    image: postgres:16
    container_name: unitlab-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: unitlab_pg
      POSTGRES_USER: unitlab_dev
      POSTGRES_PASSWORD: unitlab_dev_pass
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:7
    container_name: unitlab-redis-dev
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks:
      - app_network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: unitlab-mosquitto-dev
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - app_network

volumes:
  db_data_dev:

networks:
  app_network:
