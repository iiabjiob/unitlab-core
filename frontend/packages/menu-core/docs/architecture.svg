<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #333; }
      .section-title { font: bold 16px sans-serif; fill: #555; }
      .method { font: 14px monospace; fill: #0066cc; }
      .arrow { font: 14px sans-serif; fill: #666; }
      .description { font: 12px sans-serif; fill: #888; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; }
      .box-header { fill: #007bff; }
      .line { stroke: #adb5bd; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">MenuCore Architecture</text>

  <!-- Main Box -->
  <rect x="50" y="60" width="700" height="520" rx="8" class="box"/>
  <rect x="50" y="60" width="700" height="40" rx="8" class="box-header"/>
  <text x="400" y="85" text-anchor="middle" fill="white" font-size="18" font-weight="bold">MenuCore</text>

  <!-- State Management Section -->
  <g id="state-management">
    <text x="70" y="130" class="section-title">State Management</text>
    <line x1="90" y1="140" x2="320" y2="140" class="line"/>
    
    <text x="110" y="165" class="method">subscribe()</text>
    <text x="280" y="165" class="arrow">→</text>
    <text x="300" y="165" class="description">Observable pattern</text>
    
    <text x="110" y="190" class="method">getSnapshot()</text>
    <text x="280" y="190" class="arrow">→</text>
    <text x="300" y="190" class="description">Current state</text>
    
    <text x="110" y="215" class="method">getTree()</text>
    <text x="280" y="215" class="arrow">→</text>
    <text x="300" y="215" class="description">Shared tree instance</text>
    
    <text x="130" y="240" class="method">├─ openPath[]</text>
    <text x="320" y="240" class="arrow">→</text>
    <text x="340" y="240" class="description">Active menu hierarchy</text>
    
    <text x="130" y="260" class="method">└─ activePath[]</text>
    <text x="320" y="260" class="arrow">→</text>
    <text x="340" y="260" class="description">Highlighted item chain</text>
  </g>

  <!-- Item Registry Section -->
  <g id="item-registry">
    <text x="70" y="300" class="section-title">Item Registry</text>
    <line x1="90" y1="310" x2="320" y2="310" class="line"/>
    
    <text x="110" y="335" class="method">registerItem()</text>
    <text x="280" y="335" class="arrow">→</text>
    <text x="300" y="335" class="description">Add menu items</text>
    
    <text x="110" y="360" class="method">highlight()</text>
    <text x="280" y="360" class="arrow">→</text>
    <text x="300" y="360" class="description">Focus management</text>
    
    <text x="110" y="385" class="method">moveFocus()</text>
    <text x="280" y="385" class="arrow">→</text>
    <text x="300" y="385" class="description">Keyboard navigation</text>
    
    <text x="110" y="410" class="method">select()</text>
    <text x="280" y="410" class="arrow">→</text>
    <text x="300" y="410" class="description">Item activation</text>
  </g>

  <!-- Props Binding Section -->
  <g id="props-binding">
    <text x="420" y="130" class="section-title">Props Binding</text>
    <line x1="440" y1="140" x2="720" y2="140" class="line"/>
    
    <text x="460" y="165" class="method">getTriggerProps()</text>
    <text x="630" y="165" class="arrow">→</text>
    <text x="650" y="165" class="description">Button attributes</text>
    
    <text x="460" y="190" class="method">getPanelProps()</text>
    <text x="630" y="190" class="arrow">→</text>
    <text x="650" y="190" class="description">Panel attributes</text>
    
    <text x="460" y="215" class="method">getItemProps()</text>
    <text x="630" y="215" class="arrow">→</text>
    <text x="650" y="215" class="description">Item attributes</text>
  </g>

  <!-- Positioning Section -->
  <g id="positioning">
    <text x="420" y="265" class="section-title">Positioning</text>
    <line x1="440" y1="275" x2="720" y2="275" class="line"/>
    
    <text x="460" y="300" class="method">computePosition()</text>
    <text x="630" y="300" class="arrow">→</text>
    <text x="650" y="300" class="description">Smart placement</text>
  </g>

  <!-- Lifecycle Section -->
  <g id="lifecycle">
    <text x="420" y="340" class="section-title">Lifecycle</text>
    <line x1="440" y1="350" x2="720" y2="350" class="line"/>
    
    <text x="460" y="375" class="method">open() / close() / toggle()</text>
    
    <text x="460" y="400" class="method">cancelPendingClose()</text>
    
    <text x="460" y="425" class="method">destroy()</text>
  </g>

  <!-- Bottom Info -->
  <rect x="70" y="470" width="660" height="90" rx="6" fill="#e7f3ff" stroke="#007bff" stroke-width="2"/>
  <text x="400" y="495" text-anchor="middle" font-size="14" font-weight="bold" fill="#0056b3">Key Features</text>
  <text x="100" y="520" font-size="12" fill="#333">✓ Framework Agnostic</text>
  <text x="280" y="520" font-size="12" fill="#333">✓ Full ARIA Support</text>
  <text x="460" y="520" font-size="12" fill="#333">✓ Mouse Prediction</text>
  <text x="100" y="545" font-size="12" fill="#333">✓ Nested Submenus</text>
  <text x="280" y="545" font-size="12" fill="#333">✓ TypeScript Types</text>
  <text x="460" y="545" font-size="12" fill="#333">✓ Zero Dependencies</text>
</svg>
