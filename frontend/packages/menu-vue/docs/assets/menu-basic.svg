<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f8f9fa; }
      .border { fill: none; stroke: #dee2e6; stroke-width: 2; }
      .text { font: 14px sans-serif; fill: #495057; }
      .button { fill: #007bff; }
      .button-text { font: 12px sans-serif; fill: white; }
      .menu { fill: white; stroke: #adb5bd; stroke-width: 1; }
      .item { fill: #f8f9fa; }
      .item-hover { fill: #e9ecef; }
      .item-text { font: 11px sans-serif; fill: #212529; }
    </style>
  </defs>
  
  <rect width="300" height="200" class="bg"/>
  
  <!-- Title -->
  <text x="150" y="30" text-anchor="middle" class="text" font-weight="bold">Basic Menu Demo</text>
  
  <!-- Trigger Button -->
  <rect x="100" y="50" width="100" height="32" rx="4" class="button"/>
  <text x="150" y="71" text-anchor="middle" class="button-text">Open Menu</text>
  
  <!-- Menu Panel -->
  <rect x="100" y="90" width="140" height="100" rx="6" class="menu" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.1))"/>
  
  <!-- Menu Items -->
  <rect x="105" y="95" width="130" height="24" rx="3" class="item"/>
  <text x="115" y="110" class="item-text">📄 New File</text>
  
  <rect x="105" y="122" width="130" height="24" rx="3" class="item-hover"/>
  <text x="115" y="137" class="item-text">📁 Open...</text>
  
  <rect x="105" y="149" width="130" height="24" rx="3" class="item"/>
  <text x="115" y="164" class="item-text">💾 Save</text>
  
  <!-- Arrow indicator -->
  <path d="M 150 82 L 145 90 L 155 90 Z" fill="#007bff"/>
  
  <text x="150" y="195" text-anchor="middle" font-size="10" fill="#6c757d">Click to toggle menu</text>
</svg>
