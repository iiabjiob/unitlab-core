# Default simulator configuration used by UnitLab's virtual devices.
# All values can be overridden via CLI arguments or custom YAML files.
broker:
  host: mosquitto
  port: 1883
  keepalive: 30
  username: null
  password: null

devices:
  DO:
    count: 200
    signals: 32
    interval: 2.0
  DI:
    count: 5
    signals: 32
    interval: 1.0
  AO:
    count: 3
    signals: 10
    interval: 3.0

behavior:
  randomize: false
  heartbeat: 5.0
  reconnect_chance: 0.0
  packet_loss: 0.0
  flaky_device_ratio: 0.0
  flaky_exchange_prob: 0.0
  command_error_rate: 0.0
