services:
  backend:
    build:
      context: ./backend
    container_name: unitlab-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:  
      - ./backend:/app
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - ntp_run:/var/run/chrony
    expose:
      - "8000"   # доступен только внутри docker network
    depends_on:
      - db
      - redis
      - mosquitto
      - ntp
    networks:
      - app_network

  db:
    image: postgres:latest
    container_name: unitlab-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"   # только для других контейнеров
    networks:
      - app_network
  
  nginx:
    image: nginx:latest
    container_name: unitlab-nginx
    restart: unless-stopped
    ports:
      - "80:80"  # наружу торчит только nginx
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend   # nginx зависит от backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network
  
  redis:
    image: redis:latest
    container_name: unitlab-redis
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - app_network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: unitlab-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - app_network
  
  ntp:
    image: cturra/ntp:latest
    container_name: unitlab-ntp
    restart: unless-stopped
    ports:
      - "123:123/udp"
    volumes:
      - ./config/chrony.conf:/etc/chrony/chrony.conf
      - ntp_run:/var/run/chrony
    networks:
      - app_network

volumes:
  db_data:
  ntp_run:

networks:
  app_network:
