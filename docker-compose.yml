services:
  db:
    image: postgres:latest
    container_name: fat-simulator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: fat-simulator-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://myuser:mypassword@db:5432/mydatabase"
    expose:
      - "8000"
      

  nginx:
    image: nginx:latest  # или build: ./nginx если используем Dockerfile
    container_name: fat-simulator-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      # Монтируем нашу собранную статику (dist) в html-папку Nginx:
      - ./frontend/dist:/usr/share/nginx/html
      # Монтируем конфиг Nginx (см. nginx.conf ниже)
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  db_data:
