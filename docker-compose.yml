services:
  db:
    image: postgres:latest
    container_name: fat-simulator-db
    restart: unless-stopped
    env_file:
      - .env  # Подключаем .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  api:
    build: ./backend
    container_name: fat-simulator-api
    restart: unless-stopped
    env_file:
      - .env  # Подключаем .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
    expose:
      - "8000"
    networks:
      - app_network

  nginx:
    image: nginx:latest  # или build: ./nginx если используем Dockerfile
    container_name: fat-simulator-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      # Монтируем нашу собранную статику (dist) в html-папку Nginx:
      - ./frontend/dist:/usr/share/nginx/html
      # Монтируем конфиг Nginx (см. nginx.conf ниже)
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network: