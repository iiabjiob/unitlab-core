services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    platform: linux/arm64
    container_name: unitlab-backend
    mem_limit: 1024m
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped
    env_file: 
      - ./backend/.env.prod
    environment:
      APP_ENV: production
    expose:
      - "8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - app_network

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: unitlab-migrations
    platform: linux/arm64
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    env_file:
      - ./backend/.env.prod
      - ./backend/.env.db.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: postgres:16
    container_name: unitlab-db
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.5
    env_file: 
      - ./backend/.env.db.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unitlab_pg_user -d unitlab_pg -h db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - app_network

  nginx:
    image: nginx:1.27
    container_name: unitlab-nginx
    platform: linux/arm64
    mem_limit: 256m
    cpus: 0.25
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_network

  redis:
    image: redis:7
    container_name: unitlab-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    expose:
      - "6379"
    networks:
      - app_network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: unitlab-mosquitto
    restart: unless-stopped
    tmpfs:
      - /mosquitto/data
      - /mosquitto/log
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
