services:
  backend:
    build:
      context: ./backend
    container_name: unitlab-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - app_network

  migrations:
    build:
      context: ./backend
    command: uv run alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: postgres:16
    container_name: unitlab-db
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: unitlab-nginx
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_network

  redis:
    image: redis:7
    container_name: unitlab-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: unitlab-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - app_network

volumes:
  db_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:

networks:
  app_network:
