[project]
name = "unitlab-rpi-ntp-agent"
version = "0.1.0"
description = "Host-side Chrony/NTP management agent for UnitLab core on Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
  "redis>=5.0.0",
]

[project.scripts]
unitlab-rpi-ntp-agent = "unitlab_rpi_ntp_agent.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

